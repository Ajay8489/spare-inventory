<!-- Firebase SDK (Modular Version) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your Firebase project credentials
    const firebaseConfig = {
        apiKey: "AIzaSyBB9ItIgTVpq9KyoyNpCzs-A4kxZ0e55bk",
        authDomain: "experiment-51058.firebaseapp.com",
        projectId: "experiment-51058",
        storageBucket: "experiment-51058.firebasestorage.app",
        messagingSenderId: "523094266784",
        appId: "1:523094266784:web:e370716bfbd4a27555cac5",
        measurementId: "G-SHLW7HC5E4"
    };

    // Initialize Firebase Auth
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const userInput = document.getElementById('username').value.trim(); // Can be an email
        const passInput = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        errorMsg.classList.add('hidden');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Connecting...';

        try {
            // Authenticate securely via Firebase Auth backend
            const userCredential = await signInWithEmailAndPassword(auth, userInput, passInput);
            
            // Successfully logged in
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', userCredential.user.email);
            window.location.href = 'dashboard.html';

        } catch (error) {
            console.error("Login Error:", error);
            errorMsg.textContent = "Invalid username or password.";
            errorMsg.classList.remove('hidden');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    });
</script>
